<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trade Blotter</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1b1b; }
    header { display: flex; justify-content: space-between; align-items: center; }
    form { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; margin: 1rem 0; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.25rem; }
    input, select, button { font-size: 1rem; padding: 0.35rem 0.5rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 0.4rem; text-align: left; }
    [role="alert"] { min-height: 1.4rem; margin: 0.5rem 0; }
    .error { color: #b00020; }
    .ok { color: #1b6e20; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section id="login-view">
    <h1>Trade Blotter</h1>
    <form id="login-form">
      <label>Username <input name="username" autocomplete="username" /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="login-message" role="alert" class="error"></p>
  </section>

  <section id="blotter-view" hidden>
    <header>
      <h1>Blotter</h1>
      <div>Signed in as <strong data-testid="current-user"></strong> <button id="sign-out">Sign out</button></div>
    </header>

    <h2>New order</h2>
    <form id="order-form">
      <label>Instrument <select name="instrument"></select></label>
      <label>Side
        <select name="side"><option>BUY</option><option>SELL</option></select>
      </label>
      <label>Quantity <input name="quantity" inputmode="numeric" /></label>
      <label>Price <input name="price" inputmode="decimal" /></label>
      <button type="submit">Place order</button>
    </form>
    <p id="order-message" role="alert"></p>

    <h2>Orders</h2>
    <table aria-label="Orders">
      <thead>
        <tr><th>ID</th><th>Instrument</th><th>Side</th><th>Quantity</th><th>Price</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>

    <dialog id="amend-dialog" aria-labelledby="amend-title">
      <h3 id="amend-title">Amend order</h3>
      <form id="amend-form" method="dialog">
        <label>New quantity <input name="quantity" inputmode="numeric" /></label>
        <label>New price <input name="price" inputmode="decimal" /></label>
        <button type="submit" value="confirm">Confirm amend</button>
        <button type="button" id="amend-close">Close</button>
      </form>
      <p id="amend-message" role="alert" class="error"></p>
    </dialog>
  </section>

  <script src="app.js"></script>
</body>
</html>
